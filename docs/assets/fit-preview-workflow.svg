<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title description">
  <title id="title">FIT Preview: select a recording, press space, see the route</title>
  <desc id="description">Workflow illustration showing a FIT document, a space-bar key, and a geographic route overview with start and finish markers. Blue, coral, and green graphics on white and deep blue surfaces.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
    <pattern id="mapGrid" width="62" height="62" patternUnits="userSpaceOnUse"><path d="M62 0H0V62" fill="none" stroke="#dbe6f5" stroke-width="2"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="m2 2 7 4-7 4" fill="none" stroke="#8db9ff" stroke-width="2"/></marker>
  </defs>
  <rect width="1440" height="700" rx="28" fill="#081b41"/>
  <rect width="1440" height="700" rx="28" fill="url(#grid)"/>
  <circle cx="1350" cy="50" r="225" fill="#1263ff" opacity=".19"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
