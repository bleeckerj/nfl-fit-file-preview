      <rect x="-10" y="117" width="112" height="48" rx="12" fill="#ff675c"/>
      <text x="46" y="151" text-anchor="middle" fill="#081b41" font-size="32" font-weight="800">.FIT</text>
    </g>
    <path d="M251 374H293" stroke="#8db9ff" stroke-width="3" marker-end="url(#arrow)"/>
