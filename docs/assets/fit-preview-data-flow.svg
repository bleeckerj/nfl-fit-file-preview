<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title description">
  <title id="title">FIT Preview: local recording and decoding, network basemap</title>
  <desc id="description">The FIT file, decoder, route segments, summary stats, and Quick Look preview stay on the Mac. Apple Maps supplies geographic imagery over the network. The recording is not uploaded.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#1263ff" stroke-width="2"/></marker></defs>
  <rect width="1440" height="430" rx="24" fill="#fff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="44" y="60" fill="#081b41" font-size="30" font-weight="800">The recording stays on your Mac.</text>
    <rect x="36" y="90" width="1040" height="294" rx="18" fill="#edf5ff" stroke="#c0d7ff" stroke-width="2"/>
    <text x="62" y="126" fill="#365173" font-size="12" font-weight="700" letter-spacing="2">LOCAL PROCESSING</text>
    <rect x="64" y="177" width="196" height="112" rx="14" fill="#081b41"/>
    <text x="162" y="221" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">.fit recording</text>
    <text x="162" y="253" text-anchor="middle" fill="#b9d6ff" font-size="14">Read-only source</text>
    <path d="M274 233H315" stroke="#1263ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="333" y="177" width="216" height="112" rx="14" fill="#1263ff"/>
    <text x="441" y="221" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">FIT decoder</text>
    <text x="441" y="253" text-anchor="middle" fill="#fff" font-size="14">Validate · decode</text>
    <path d="M563 233H604" stroke="#1263ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="622" y="157" width="178" height="70" rx="12" fill="#fff" stroke="#1263ff" stroke-width="2"/>
    <text x="711" y="198" text-anchor="middle" fill="#081b41" font-size="18" font-weight="700">Route segments</text>
    <rect x="622" y="241" width="178" height="70" rx="12" fill="#fff" stroke="#00a66f" stroke-width="2"/>
    <text x="711" y="282" text-anchor="middle" fill="#081b41" font-size="18" font-weight="700">Recorded stats</text>
    <path d="M812 192H836V233H852M812 276H836V233" stroke="#1263ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="871" y="177" width="177" height="112" rx="14" fill="#081b41"/>
    <text x="959" y="221" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Quick Look</text>
    <text x="959" y="253" text-anchor="middle" fill="#b9d6ff" font-size="14">Native map preview</text>
    <text x="64" y="352" fill="#365173" font-size="15">No account · No FIT upload · No request for your Mac's current location</text>
    <rect x="1154" y="165" width="248" height="136" rx="14" fill="#1263ff"/>
    <text x="1278" y="211" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Apple Maps</text>
    <text x="1278" y="242" text-anchor="middle" fill="#fff" font-size="14">Geographic imagery</text>
    <text x="1278" y="271" text-anchor="middle" fill="#fff" font-size="14">Network connection</text>
    <path d="M1140 233H1067" stroke="#1263ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1122" y="352" fill="#365173" font-size="13">Map requests identify the viewed area.</text>
  </g>
</svg>
